<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>综合编码解密工具 Base64 Gzip HEX 猎狼AES</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Microsoft YaHei}
body{padding:20px;background:#f5f7fa;max-width:1280px;margin:0 auto}
.card{background:#fff;padding:18px;border-radius:10px;margin-bottom:20px;box-shadow:0 1px 8px #e2e6ef}
h3{margin-bottom:12px;color:#1f2937;font-size:17px}
textarea{width:100%;height:150px;padding:10px;border:1px solid #d1d5db;border-radius:6px;margin:8px 0;resize:vertical}
input{width:100%;padding:9px;border:1px solid #d1d5db;border-radius:6px;margin:7px 0}
.btns{display:flex;gap:12px;margin:12px 0;flex-wrap:wrap}
button{padding:9px 18px;border:none;border-radius:6px;color:#fff;cursor:pointer;font-size:14px}
.btn-b64{background:#059669}
.btn-gzip{background:#2563eb}
.btn-hex{background:#9333ea}
.btn-aes{background:#e64398}
.btn-clear{background:#6b7280}
.tip{color:#666;font-size:13px;margin:6px 0}
hr{border:0;border-top:1px solid #eee;margin:16px 0}
.aes-row{display:flex;gap:16px;margin:8px 0}
.aes-col{flex:1}
</style>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
</head>
<body>

<!-- 1. Base64 编解码（支持TXT上传/导出） -->
<div class="card">
<h3>1. Base64 编解码（支持上传文件读取文本/导出文件）</h3>
<input type="file" id="b64FileInput" accept=".txt">
<div class="btns">
<button class="btn-b64" onclick="readTxtFileToBox()">读取TXT文件到文本框</button>
<button class="btn-b64" onclick="txtToB64()">文本转Base64</button>
<button class="btn-b64" onclick="b64ToTxt()">Base64解码文本</button>
<button class="btn-b64" onclick="saveBoxToTxt()">文本框内容导出TXT</button>
<button class="btn-clear" onclick="document.getElementById('b64Txt').value=''">清空</button>
</div>
<textarea id="b64Txt" placeholder="输入明文 / Base64密文"></textarea>
</div>

<!-- 2. Gzip-Base64 压缩解压（支持TXT上传/导出） -->
<div class="card">
<h3>2. Gzip-Base64 压缩解压（支持TXT文件读写）</h3>
<input type="file" id="gzipFileInput" accept=".txt">
<div class="btns">
<button class="btn-gzip" onclick="readGzipTxt()">读取TXT</button>
<button class="btn-gzip" onclick="txtGzipB64()">明文→GzipBase64</button>
<button class="btn-gzip" onclick="gzipB64Txt()">GzipBase64→明文</button>
<button class="btn-gzip" onclick="saveGzipTxt()">导出TXT</button>
<button class="btn-clear" onclick="document.getElementById('gzipTxt').value=''">清空</button>
</div>
<textarea id="gzipTxt" placeholder="明文 / H4sI开头压缩串"></textarea>
<div class="tip">首次联网加载pako，断网仅Gzip失效</div>
</div>

<!-- 4. TVBox AES-128-CBC 专用加解密 -->
<div class="card">
<h3>4. TVBox AES加解密（匹配原版拼接格式）</h3>
<input type="file" id="aesFileInput" accept=".txt">
<div class="aes-row">
    <div class="aes-col">
        <label>密钥KEY</label>
        <input id="aesKey" maxlength="16" placeholder="输入密钥，不足16位自动补0" value="123456">
    </div>
    <div class="aes-col">
        <label>IV向量（加密自动生成）</label>
        <input id="aesIv" disabled placeholder="解密自动提取">
    </div>
    <div class="aes-col">
        <label>模式</label>
        <select id="aesMode" style="width:100%;padding:9px;border-radius:6px;border:1px solid #d1d5db;">
            <option value="encrypt">加密</option>
            <option value="decrypt">解密</option>
        </select>
    </div>
</div>
<div class="btns">
<button class="btn-aes" onclick="readAesTxt()">读取TXT文件</button>
<button class="btn-aes" onclick="runAes()">执行加解密</button>
<button class="btn-aes" onclick="saveAesTxt()">导出TXT文件</button>
<button class="btn-clear" onclick="document.getElementById('aesTxt').value=''">清空</button>
</div>
<textarea id="aesTxt" placeholder="加密填原始配置文本，解密粘贴完整十六进制密文"></textarea>
<div class="tip">加密输出格式：$#key#$十六进制密文 + 时间戳Hex，与猎狼网页完全互通</div>
</div>

<script>
// ====================== 通用文件读写函数 ======================
function readTextFile(fileDomId, textareaId){
    const file = document.getElementById(fileDomId).files[0];
    if(!file) return alert('请选择txt文件');
    const reader = new FileReader();
    reader.onload = e=>document.getElementById(textareaId).value = e.target.result;
    reader.readAsText(file);
}
function saveTextToFile(textareaId, fileName="output.txt"){
    const text = document.getElementById(textareaId).value;
    const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fileName;
    a.click();
    URL.revokeObjectURL(a.href);
}

// ====================== 1.Base64 模块 ======================
function readTxtFileToBox(){readTextFile('b64FileInput','b64Txt')}
function saveBoxToTxt(){saveTextToFile('b64Txt','base64输出.txt')}
function txtToB64(){
    const t = document.getElementById('b64Txt').value;
    document.getElementById('b64Txt').value = btoa(unescape(encodeURIComponent(t)));
}
function b64ToTxt(){
    const t = document.getElementById('b64Txt').value.trim();
    document.getElementById('b64Txt').value = decodeURIComponent(escape(atob(t)));
}

// ====================== 2.Gzip模块 ======================
function readGzipTxt(){readTextFile('gzipFileInput','gzipTxt')}
function saveGzipTxt(){saveTextToFile('gzipTxt','gzip输出.txt')}
function txtGzipB64(){
    if(!window.pako) return alert('请联网刷新加载压缩库');
    const buf = new TextEncoder().encode(document.getElementById('gzipTxt').value);
    const zip = pako.gzip(buf);
    document.getElementById('gzipTxt').value = btoa(String.fromCharCode(...zip));
}
function gzipB64Txt(){
    if(!window.pako) return alert('请联网刷新加载压缩库');
    const raw = atob(document.getElementById('gzipTxt').value.trim());
    const arr = Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
    const out = pako.ungzip(arr);
    document.getElementById('gzipTxt').value = new TextDecoder().decode(out);
}

// ====================== 3.HEX十六进制模块 ======================
function readHexTxt(){readTextFile('hexFileInput','hexTxt')}
function saveHexTxt(){saveTextToFile('hexTxt','hex输出.txt')}
function textToHex(){
    const text = document.getElementById('hexTxt').value;
    const encoder = new TextEncoder();
    const bytes = encoder.encode(text);
    let hexStr = '';
    for(let b of bytes){
        hexStr += b.toString(16).padStart(2,'0');
    }
    document.getElementById('hexTxt').value = hexStr;
}
function hexToText(){
    let hexRaw = document.getElementById('hexTxt').value.trim();
    hexRaw = hexRaw.replace(/\s/g,'');
    if(hexRaw.length % 2 !== 0){
        alert('十六进制字符串长度必须为偶数，请检查输入！');
        return;
    }
    const bytes = [];
    for(let i=0;i<hexRaw.length;i+=2){
        const byteVal = parseInt(hexRaw.slice(i,i+2),16);
        if(isNaN(byteVal)){
            alert('包含非法十六进制字符，仅允许0-9 a-f A-F');
            return;
        }
        bytes.push(byteVal);
    }
    const uint8 = new Uint8Array(bytes);
    document.getElementById('hexTxt').value = new TextDecoder().decode(uint8);
}

// ====================== 4.猎狼TVBox AES专用模块 ======================
const aesTxt = document.getElementById('aesTxt');
const aesKey = document.getElementById('aesKey');
const aesIv = document.getElementById('aesIv');
const aesMode = document.getElementById('aesMode');

function readAesTxt(){readTextFile('aesFileInput','aesTxt')}
function saveAesTxt(){
    const name = aesMode.value==='encrypt' ? 'tvbox加密.txt' : 'tvbox解密.txt';
    saveTextToFile('aesTxt', name);
}

function padTo16Byte(str) {
    return CryptoJS.enc.Utf8.parse(str.toString().padEnd(16, '0'));
}
function Encrypt(word, keyStr, ivStr) {
    const key = padTo16Byte(keyStr);
    const iv = padTo16Byte(ivStr);
    const encrypted = CryptoJS.AES.encrypt(word, key, { iv, padding:CryptoJS.pad.Pkcs7 });
    return encrypted.ciphertext.toString(CryptoJS.enc.Hex);
}
function Decrypt(word, keyStr, ivStr) {
    const key = padTo16Byte(keyStr);
    const iv = padTo16Byte(ivStr);
    const ciphertext = CryptoJS.enc.Hex.parse(word);
    const decrypt = CryptoJS.AES.decrypt({ ciphertext }, key, { iv, padding:CryptoJS.pad.Pkcs7 });
    return decrypt.toString(CryptoJS.enc.Utf8);
}
function decryptAesBCB(encryptedData) {
    const prefixRaw = "$#";
    const suffixRaw = "#$";
    const prefixCode = CryptoJS.enc.Utf8.parse(prefixRaw).toString();
    const suffixCode = CryptoJS.enc.Utf8.parse(suffixRaw).toString();
    const dataArr = encryptedData.split("");
    const suffixFull = suffixCode;
    const pwdMixEndIdx = encryptedData.indexOf(suffixFull) + suffixFull.length;
    const pwdMix = dataArr.splice(0, pwdMixEndIdx).join("");
    const roundtimeHex = dataArr.splice(dataArr.length - 26, 26).join("");
    const cipherHex = dataArr.join("");
    const pwdHex = pwdMix.substring(prefixCode.length, pwdMix.length - suffixCode.length);
    const roundTime = CryptoJS.enc.Utf8.stringify(CryptoJS.enc.Hex.parse(roundtimeHex));
    const realKey = CryptoJS.enc.Utf8.stringify(CryptoJS.enc.Hex.parse(pwdHex));
    const iv = padTo16Byte(roundTime);
    const pk = padTo16Byte(realKey);
    const cipherParams = CryptoJS.lib.CipherParams.create({
        ciphertext: CryptoJS.enc.Hex.parse(cipherHex)
    });
    const dec = CryptoJS.AES.decrypt(cipherParams, pk, {
        iv: iv,
        mode: CryptoJS.mode.CBC,
        padding: CryptoJS.pad.Pkcs7
    });
    return dec.toString(CryptoJS.enc.Utf8);
}
function toHex(str) {
    return CryptoJS.enc.Hex.stringify(CryptoJS.enc.Utf8.parse(str));
}

function runAes(){
    const text = aesTxt.value.trim();
    const key = aesKey.value;
    if(!text){
        alert("请输入文本或上传文件");
        return;
    }
    if(aesMode.value === 'encrypt'){
        const timestamp = String(new Date().getTime());
        aesIv.value = timestamp;
        const aesHex = Encrypt(text, key, timestamp);
        const keyWrapHex = toHex(`$#${key}#$`);
        const ivHex = toHex(timestamp);
        const fullCipher = keyWrapHex + aesHex + ivHex;
        aesTxt.value = fullCipher;
    }else{
        try{
            const plain = decryptAesBCB(text);
            aesTxt.value = plain;
        }catch(err){
            alert("解密失败：密钥不匹配或密文格式错误");
            console.error(err);
        }
    }
}
</script>
</body>
</html>
